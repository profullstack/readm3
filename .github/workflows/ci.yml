name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:bun
      - name: Shared document API and interfaces
        run: bun run test:server
      - name: Build
        run: bun run build
      - name: Build the site
        run: bun run site:build

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Test
        run: npm test
      - name: Build and smoke-test the bin
        run: |
          bun run build
          node bin/readm3.mjs --version
          node bin/readm3.mjs --help > /dev/null
      - name: Node CLI and MCP against document API
        env:
          READM3_TEST_NODE: "1"
        run: bun test server/test/surfaces.test.ts server/test/sync.test.ts

  browser:
    name: web reader and offline PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:site
      - run: bun run test:accounts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/

  container:
    name: production Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag readm3-ci .
      - name: Start the production server and check account sync
        run: |
          docker run --detach --name readm3-ci -e READM3_DB=:memory: -p 127.0.0.1:8080:3000 readm3-ci
          trap 'docker logs readm3-ci; docker rm --force readm3-ci' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/viewer --output /tmp/readm3-viewer.html
          grep -q 'sync-workspace' /tmp/readm3-viewer.html
          test "$(curl --silent --show-error http://127.0.0.1:8080/api/v1/settings --output /tmp/readm3-settings.json --write-out '%{http_code}')" = 401
          python3 -c 'import json; assert json.load(open("/tmp/readm3-settings.json"))["ok"] is False'
