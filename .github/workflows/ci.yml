name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:bun
      - name: Account security tests
        run: bun test ./server/test
      - name: Build
        run: bun run build
      - name: Build the site
        run: bun run site:build

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Test
        run: npm test
      - name: Build and smoke-test the bin
        run: |
          bun run build
          node bin/readm3.mjs --version
          node bin/readm3.mjs --help > /dev/null

  browser:
    name: web reader and offline PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:site
      - run: bun run test:accounts
