name: Desktop

# The readm3 desktop app (desktop/): an AppImage and a Flatpak for Linux x64.
# A published release gets both attached, with SHA256SUMS (install.sh --desktop
# verifies against it). A pull request that touches the app builds both as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v0.11.0
        required: true
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the editor
        run: bun run site:build
      - name: Install the desktop build tools
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install flatpak-builder and the Flathub remote
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Package AppImage and Flatpak
        working-directory: desktop
        run: node build.mjs AppImage flatpak
      - name: Checksums
        working-directory: desktop/release
        run: |
          sha256sum readm3-linux-*.AppImage readm3-linux-*.flatpak > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desktop/release
        run: gh release upload "$TAG" readm3-linux-*.AppImage readm3-linux-*.flatpak SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep the builds
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: readm3-desktop
          path: |
            desktop/release/readm3-linux-*.AppImage
            desktop/release/readm3-linux-*.flatpak
            desktop/release/SHA256SUMS
          retention-days: 7
